services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database_net

  backend:
    build: ./backend
    environment:
      db_name: ${POSTGRES_DB}
      db_password: ${POSTGRES_PASSWORD}
      db_user: ${POSTGRES_USER}
      db_host: ${DB_HOST}
      db_port: ${DB_PORT}
    ports:
      - "${BACKEND_PORT}:8000"
    networks:
      - database_net
      - frontend_net
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    networks:
      - frontend_net
    depends_on:
      - backend
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend_net
      - database_net
    depends_on:
      - backend
      - frontend
networks:
  frontend_net:
  database_net:
volumes:
  postgres_data:
