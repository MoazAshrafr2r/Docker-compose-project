name: ci test
on:
  push:
    branches:
      - main
  

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
        contents: read
        packages: write
    steps:
      - name: checkout code 
        uses: actions/checkout@v7
        
      - name: login to Github container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/${{github.actor}}/docker-compose-project-backend:latest
      - name: build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: ghcr.io/${{github.actor}}/docker-compose-project-frontend:latest
